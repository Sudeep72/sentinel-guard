version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "agent"]
    commit-message:
      prefix: "chore(agent)"

  - package-ecosystem: "pip"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "dashboard"]
    commit-message:
      prefix: "chore(dashboard)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
