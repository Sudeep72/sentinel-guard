[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelguard-dashboard"
version = "1.0.1"
description = "SentinelGuard Dashboard — orchestrator backend (REST API + MCP server) for the SentinelGuard Linux hardening platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sentinelguard-contracts>=1.0.0,<2.0.0",
    "pydantic>=2.7,<3",
    "email-validator>=2.1,<3",
    "pyyaml>=6.0,<7",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<6",
    "python-multipart>=0.0.9",
    "mcp[cli]>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<1",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
sentinelguard-dashboard = "app.main:run"
sentinelguard-mcp = "app.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum pattern used intentionally for pydantic compatibility.
# B008: FastAPI's Depends()/Query() in argument defaults is the framework's
# standard idiom, not the mutable-default-argument bug B008 targets.
ignore = ["UP042", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/db/migrations/versions"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["app/db/migrations/versions"]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
