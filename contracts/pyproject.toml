[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelguard-contracts"
version = "1.0.1"
description = "Shared wire-format contracts (pydantic models) for the SentinelGuard Agent and Dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinelguard_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"sentinelguard_contracts/py.typed" = "sentinelguard_contracts/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: we deliberately use `class X(str, Enum)` rather than `StrEnum` for
# broad compatibility with pydantic v2's enum handling across the range of
# Python versions this project supports.
ignore = ["UP042"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
