repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(agent|dashboard)/.*\.py$

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^(agent|dashboard)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        files: ^(agent|dashboard)/.*\.py$
        additional_dependencies: ["pydantic>=2", "types-requests"]
        args: ["--ignore-missing-imports"]

# NOTE: this config activates meaningfully once Python source lands
# starting Phase 2 (shared contracts). Installed now so it's in place
# from day one, per project's "GitHub quality from day one" requirement.
