[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelguard-agent"
version = "1.0.1"
description = "SentinelGuard Linux Agent — collects Linux security posture data for the SentinelGuard Dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sentinelguard-contracts>=1.0.0,<2.0.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
sentinelguard-agent = "sentinelguard_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinelguard_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
